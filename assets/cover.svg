<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 400" width="1280" height="400" role="img" aria-label="Agent Toolkit Index" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <defs>
    <pattern id="minor" width="20" height="20" patternUnits="userSpaceOnUse">
      <path d="M20 0H0V20" fill="none" stroke="#14264A" stroke-width="1"/>
    </pattern>
    <pattern id="major" width="100" height="100" patternUnits="userSpaceOnUse">
      <rect width="100" height="100" fill="url(#minor)"/>
      <path d="M100 0H0V100" fill="none" stroke="#1C3463" stroke-width="1"/>
    </pattern>
    <!-- Horizontal beam: bright edge on the right, moving left-to-right -->
    <linearGradient id="scanH" x1="0" x2="1" y1="0" y2="0">
      <stop offset="0" stop-color="#4CC9F0" stop-opacity="0"/>
      <stop offset="0.85" stop-color="#4CC9F0" stop-opacity="0.10"/>
      <stop offset="1" stop-color="#4CC9F0" stop-opacity="0.55"/>
    </linearGradient>
    <!-- Vertical beam: bright edge at the bottom, moving top-to-bottom -->
    <linearGradient id="scanV" x1="0" x2="0" y1="0" y2="1">
      <stop offset="0" stop-color="#4CC9F0" stop-opacity="0"/>
      <stop offset="0.85" stop-color="#4CC9F0" stop-opacity="0.10"/>
      <stop offset="1" stop-color="#4CC9F0" stop-opacity="0.50"/>
    </linearGradient>
    <clipPath id="frame"><rect x="20" y="20" width="1240" height="360"/></clipPath>
    <style>
      .mono { font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, "Liberation Mono", monospace; }
      .beamH { animation: sweepH 8s linear infinite; }
      @keyframes sweepH { 0% { transform: translateX(0); } 80%, 100% { transform: translateX(1400px); } }
      .beamV { animation: sweepV 8s linear infinite; }
      @keyframes sweepV { 0% { transform: translateY(0); } 80%, 100% { transform: translateY(480px); } }
      .cursor { animation: blink 1s step-end infinite; }
      @keyframes blink { 50% { opacity: 0; } }
    </style>
  </defs>

  <!-- Background and grid -->
  <rect width="1280" height="400" fill="#0A1630"/>
  <rect width="1280" height="400" fill="url(#major)"/>

  <!-- Scanning beams -->
  <g clip-path="url(#frame)">
    <rect class="beamH" x="-140" y="20" width="160" height="360" fill="url(#scanH)"/>
    <rect class="beamV" x="20" y="-100" width="1240" height="120" fill="url(#scanV)"/>
  </g>

  <!-- Drawing frame -->
  <rect x="20" y="20" width="1240" height="360" fill="none" stroke="#2A4A85" stroke-width="1.5"/>
  <rect x="28" y="28" width="1224" height="344" fill="none" stroke="#2A4A85" stroke-width="0.75"/>

  <!-- Corner registration marks -->
  <g stroke="#4CC9F0" stroke-width="1" stroke-opacity="0.6" fill="none">
    <path d="M44 56V44H56"/><path d="M1224 44H1236V56"/>
    <path d="M44 344V356H56"/><path d="M1224 356H1236V344"/>
  </g>

  <!-- Centered title -->
  <text x="640" y="160" class="mono" text-anchor="middle" fill="#E6F1FF" font-size="80" font-weight="700" textLength="800" lengthAdjust="spacing">AGENT TOOLKIT</text>
  <text x="640" y="250" class="mono" text-anchor="middle" fill="#4CC9F0" font-size="80" font-weight="700" textLength="300" lengthAdjust="spacing">INDEX</text>
  <rect class="cursor" x="806" y="240" width="40" height="9" fill="#4CC9F0"/>
  <line x1="340" y1="282" x2="940" y2="282" stroke="#2A4A85" stroke-width="1"/>
  <text x="640" y="314" class="mono" text-anchor="middle" fill="#7FA3D9" font-size="17" letter-spacing="3">CLAUDE CODE · SKILLS · HOOKS · RULES · AGENTS</text>

  <!-- Title block -->
  <g class="mono" font-size="10" letter-spacing="1.5">
    <rect x="1066" y="322" width="174" height="44" fill="#0A1630" stroke="#2A4A85" stroke-width="1"/>
    <line x1="1066" y1="344" x2="1240" y2="344" stroke="#2A4A85" stroke-width="1"/>
    <line x1="1160" y1="322" x2="1160" y2="366" stroke="#2A4A85" stroke-width="1"/>
    <text x="1074" y="337" fill="#7FA3D9">DWG ATI-001</text>
    <text x="1168" y="337" fill="#7FA3D9">REV C</text>
    <text x="1074" y="359" fill="#A9C8F5">BY</text>
    <text x="1168" y="359" fill="#4CC9F0">@bugaeff</text>
  </g>
</svg>
